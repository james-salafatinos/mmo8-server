<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Simple MMO</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/editor.css">
    <link rel="stylesheet" href="css/inventory.css">
</head>
<body>
    <!-- Login/Register Screen -->
    <div id="auth-screen">
        <div id="auth-container">
            <h1>Simple MMO</h1>
            <div id="auth-tabs">
                <button class="auth-tab active" data-tab="login">Login</button>
                <button class="auth-tab" data-tab="register">Register</button>
            </div>
            <form id="auth-form">
                <input type="text" id="auth-username" placeholder="Username" autocomplete="username" required>
                <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password" required>
                <button type="submit" id="auth-submit">Login</button>
                <div id="auth-error"></div>
                <div id="force-login-container" style="display:none;">
                    <p>Already logged in elsewhere.</p>
                    <button type="button" id="force-login-btn">Kick other session</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Context Menu (hidden until triggered) -->
    <div id="context-menu" style="display:none;">
        <div id="context-menu-title">Select Action</div>
        <div id="context-menu-items"></div>
    </div>

    <!-- Game Screen (hidden until login) -->
    <div id="game-screen" style="display:none;">
        <!-- Top-left minimal controls (room selector, admin) -->
        <div id="top-left-controls">
            <div id="room-selector"></div>
        </div>
        
        <!-- Bottom-right game UI tabs (Runescape-style) -->
        <div id="game-ui-tabs">
            <button id="levels-toggle-btn" class="game-tab-btn" title="Levels">❤️</button>
            <button id="inventory-toggle-btn" class="game-tab-btn" title="Inventory (I)">🎒</button>
            <button id="equipment-toggle-btn" class="game-tab-btn" title="Equipment (E)">⚔️</button>
        </div>
        
        <!-- Levels Panel (replaces HP bar) -->
        <div id="levels-panel" class="game-panel" style="display:none;">
            <div class="panel-header">
                <span>Levels</span>
                <button class="panel-close-btn" data-panel="levels">✕</button>
            </div>
            <div class="levels-content">
                <div class="level-row">
                    <span class="level-icon">❤️</span>
                    <span class="level-name">Hitpoints</span>
                    <span id="hp-level" class="level-value">10/10</span>
                    <div class="level-bar-bg">
                        <div id="hp-bar-fill" class="level-bar-fill hp"></div>
                    </div>
                </div>
                <div class="level-row">
                    <span class="level-icon">💪</span>
                    <span class="level-name">Strength</span>
                    <span id="str-level" class="level-value">1</span>
                    <div class="level-bar-bg">
                        <div id="str-bar-fill" class="level-bar-fill str"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Death Screen -->
        <div id="death-screen" style="display:none;">
            <div id="death-message">
                <h1>You Died</h1>
                <p>Respawning...</p>
            </div>
        </div>

        <!-- Hit Splat Container -->
        <div id="hit-splat-container"></div>

        <!-- Leaderboard Popup -->
        <div id="leaderboard-overlay" style="display:none;">
            <div id="leaderboard-popup">
                <div id="leaderboard-header">
                    <h2>⚔️ Leaderboard</h2>
                    <button id="leaderboard-close">✕</button>
                </div>
                <div id="leaderboard-content">
                    <table id="leaderboard-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Player</th>
                                <th>Kills</th>
                                <th>Deaths</th>
                                <th>K/D</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="container">
            <div id="scene-container"></div>
            
            <div id="chat-container">
                <div id="chat-header">
                    <h2>Chat</h2>
                    <div id="chat-header-right">
                        <button id="leaderboard-btn" title="Leaderboard">🏆</button>
                        <button id="logout-btn" title="Logout">🚪</button>
                        <div id="user-count">0 online</div>
                    </div>
                </div>
                <div id="chat-messages"></div>
                <div id="chat-input-container">
                    <input type="text" id="chat-input" placeholder="Message... (/w username for whisper)">
                    <button id="send-button">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Import three.js via ES modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
            }
        }
    </script>
    
    <!-- Socket.io client -->
    <script src="/socket.io/socket.io.js"></script>
    
    <!-- Application scripts -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
